[package]
name = "fimod"
version = "0.9.0"
edition = "2021"
description = "fimod - the data shaper CLI. Transform structured data with embedded Python, no install required."
license = "Apache-2.0"
repository = "https://github.com/pytgaen/fimod"
homepage = "https://pytgaen.github.io/fimod"
documentation = "https://pytgaen.github.io/fimod"
categories = ["command-line-utilities", "development-tools"]
keywords = ["cli", "data-shaper", "data-transformation", "json", "yaml"]
rust-version = "1.95"

[features]
default = ["reqwest", "watch"]
full = ["reqwest", "watch"]
slim = []
fast = []
reqwest = ["dep:reqwest"]
watch = ["dep:notify"]

[[bin]]
name = "fimod"
path = "src/main.rs"

[[bin]]
name = "fimod-fast"
path = "src/main.rs"
required-features = ["fast"]

[dependencies]
monty = { git = "https://github.com/pydantic/monty", tag = "v0.0.21" }
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4.6.3", features = ["unstable-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
serde-saphyr = "1.1.0"  # pure-Rust YAML (replaces deprecated serde_yaml)
toml = { version = "1", features = ["preserve_order"] }
csv = "1.4"
reqwest = { version = "0.13", features = ["blocking", "rustls", "system-proxy"], default-features = false, optional = true }
fancy-regex = "0.19"
rustyline = "18"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
digest = "0.11.3"
hex = "0.4"
mimalloc = "0.1"
minijinja = { version = "2", features = ["json", "loop_controls", "preserve_order"] }
indexmap = "2.14.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = { version = "8", optional = true }

[profile.release]
strip = true  # Automatically strip symbols from the binary.
opt-level = "z"  # Optimize for size.
lto = true
codegen-units = 1
panic = "abort"

[profile.release-fast]
inherits = "release"
opt-level = 3  # Speed over size (used by fimod-fast)


[lints.rust]
deprecated = "deny"
unsafe_code = "deny"

[lints.clippy]
# Hard denies
redundant_clone = "deny"

# Style improvements
redundant_closure = "warn"
match_same_arms = "warn"
redundant_else = "warn"
uninlined_format_args = "warn"

# Pedantic noise to silence
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
tempfile = "3"
httpmock = "0.8"

[patch.crates-io]
# jiter 0.15.0 on crates.io is pinned to pyo3 0.28.x, which trips
# RUSTSEC-2026-0176/RUSTSEC-2026-0177 in cargo-audit. Upstream main keeps the
# same jiter version but has already moved the optional Python bindings to
# pyo3 0.29.0; remove this patch after the next jiter crate release.
jiter = { git = "https://github.com/pydantic/jiter", rev = "6d57715e01ec78859c62fc5447073c0b5902de39" }
